name: Test
on:
  pull_request:
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LEFTHOOK: 0
      MISE_ENV: test
      MISE_EXPERIMENTAL: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - run: bun install
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(bun -e "console.log(require('./package.json').devDependencies['@playwright/test'])")" >> $GITHUB_OUTPUT
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bun run playwright install --with-deps
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bun run playwright install-deps
      - name: Run tests on Docker container
        run: mise run test-docker
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 14
